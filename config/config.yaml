# Configuration for Multimodel Sentiment Analysis of Text in DL
project_title: "Multimodel Sentiment Analysis of Text in DL"

dataset:
  raw_path: "data/raw/imdb_dataset.csv"
  processed_dir: "data/processed"
  text_col: "review"
  label_col: "sentiment"
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  random_seed: 42

preprocessing:
  lowercase: true
  remove_html: true
  max_vocab_size: 15000
  max_seq_len: 200
  tfidf_max_features: 10000
  tfidf_ngram_range: [1, 2]

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    random_state: 42

  naive_bayes:
    alpha: 1.0
    fit_prior: true

  lstm:
    vocab_size: 15000
    embedding_dim: 64
    hidden_dim: 64
    num_layers: 1
    bidirectional: true
    dropout: 0.3
    learning_rate: 0.002
    weight_decay: 0.00001
    batch_size: 128
    max_epochs: 5
    patience: 2
    random_state: 42
    max_train_samples: 12000
    max_val_samples: 2500

paths:
  models_dir: "models"
  results_dir: "results"
  metrics_dir: "results/metrics"
  figures_dir: "results/figures"
